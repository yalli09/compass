version: '3.8'

services:
  compass:
    build: .
    container_name: compass-app
    network_mode: bridge
    ports:
      - "5030:5030"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./json:/app/json
    environment:
      - FLASK_ENV=production
      - ROUTING_ENGINE_URL=https://router.project-osrm.org
    restart: unless-stopped